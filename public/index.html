<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Concert Ticketing - 서버 연결 확인</title>
  <style>body{font-family:system-ui,sans-serif;max-width:750px;margin:60px auto;padding:0 20px;line-height:1.6}button{padding:9px 14px;cursor:pointer}pre{background:#f3f4f6;padding:18px;border-radius:8px;white-space:pre-wrap}</style>
</head>
<body>
  <h1>Concert Ticketing</h1>
  <p>백엔드 및 SQLite 연결 확인용 임시 화면입니다. 실제 티켓팅 UI는 이후 구현합니다.</p>
  <button id="check">서버 상태 및 공연 조회</button>
  <pre id="result">버튼을 눌러 API 연결을 확인하세요.</pre>
  <script>
    document.querySelector('#check').addEventListener('click', async () => {
      const output = document.querySelector('#result');
      try {
        const [health, concerts] = await Promise.all([
          fetch('/api/health').then(r => { if (!r.ok) throw new Error('health 오류'); return r.json(); }),
          fetch('/api/concerts').then(r => { if (!r.ok) throw new Error('concerts 오류'); return r.json(); })
        ]);
        output.textContent = JSON.stringify({ health, concerts }, null, 2);
      } catch (err) { output.textContent = `연결 실패: ${err.message}`; }
    });
  </script>
</body>
</html>
