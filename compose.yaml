services:
  web:
    build: .
    container_name: week10-concert-web
    ports:
      - "80:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /app/data/concert.db
      QUEUE_ACTIVE_LIMIT: ${QUEUE_ACTIVE_LIMIT:-2}
      QUEUE_ADMISSION_TTL_SECONDS: ${QUEUE_ADMISSION_TTL_SECONDS:-120}
    volumes:
      - concert-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  concert-data:
